apply from: 'gradle/scripts/helpers.gradle'

// Concrete GUIs use AEBaseGui. Keep ModularUI out of every project configuration, including
// development/runtime classpaths and any future transitive mod dependency.
configurations.configureEach {
    exclude group: 'com.cleanroommc', module: 'modularui'
}

dependencies {
    implementation("com.cleanroommc:cleanmix:0.7.4") {
        // The game supplies Gson/Guava/ASM; CleanMix's old runtime dependencies shadow them in tests.
        transitive = false
    }
    modImplementation 'mezz:jei:4.35.1'
    // Script adapters are optional; the public Java API never links CraftTweaker classes.
    modCompileOnly 'CraftTweaker2:CraftTweaker2-API:4.1.20.718'
    modCompileOnly 'CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.718'
    modCompileOnly 'CraftTweaker2:ZenScript:4.1.20.718'
    // Imported pools link optional source APIs only when their source mod is present.
    modCompileOnly('curse.maven:industrialcraft-2-242638:3078604') { transitive = false }
    modCompileOnly('curse.maven:nuclearcraft-overhauled-336895:6605808') { transitive = false }
    modCompileOnly('curse.maven:tinkers-construct-74072:2902483') { transitive = false }
    modCompileOnly('curse.maven:mantle-74924:2713386') { transitive = false }
    modCompileOnly('curse.maven:thaumcraft-223628:2629023') { transitive = false }
    modCompileOnly('curse.maven:baubles-227083:2518667') { transitive = false }
    modCompileOnly('curse.maven:thermal-expansion-69163:2926431') { transitive = false }
    modCompileOnly('curse.maven:thermal-foundation-222880:2926428') { transitive = false }
    modCompileOnly('curse.maven:cofh-core-69162:2920433') { transitive = false }
    modCompileOnly('curse.maven:RedstoneFlux-270789:2920436') { transitive = false }
    // Keep the original Gecko coordinate; this repository delivers a jar whose VERSION field is 3.0.30.
    modImplementation 'software.bernie.geckolib:geckolib-forge-1.12.2:3.0.31'
    modImplementation 'curse.maven:component-model-hider-940949:4885858'
    modCompileOnly 'curse.maven:lumenized-1234162:6734060'
    //modRuntimeOnly 'curse.maven:lumenized-1234162:6734060'
    modCompileOnly 'curse.maven:ctm-267602:2915363'
    modRuntimeOnly 'curse.maven:ctm-267602:2915363'
    // Lumenized's Bloom shaders require CodeChickenLib's shader API at runtime.
    modRuntimeOnly 'codechicken:CodeChickenLib:3.3.5'
    // AEBaseGui implements this optional API; javac needs it when compiling our concrete GUIs.
    modCompileOnly 'curse.maven:mouse-tweaks-unofficial-461660:5876158'

    // Persistent owner teams use the original FTBLib / FTB Utilities 1.12.2 APIs directly.
    modImplementation 'curse.maven:ftb-library-237167:2985811'
    modImplementation 'curse.maven:ftb-utilities-237102:3157548'

    // MDG must load mod jars through the game classloader, including dev jars.
    modImplementation("com.github.FormlessDragon:Applied-Energistics-2-Supergiant:${ae2_version}:dev") {
        transitive = false
    }

}

if (propertyBool('enable_shadow')) {
    tasks.named("shadowJar").configure {
        // Exclude specific parts of deps to keep your jar clean
        // dependencies {
        //     exclude 'META-INF/maven/**'
        // }

        // Relocate specific parts of deps, so multiple shaded classes in mods will not conflict
        // relocate "mezz.jei", "shaded.mezz.jei"

        // Remove unused classes automatically. May cause issues if they are accessed by reflection
        // minimize()
    }
}
