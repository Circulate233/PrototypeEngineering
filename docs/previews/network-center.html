<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网络中心 · GUI 预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #25272d; color: #ccd0d6; font: 14px "Microsoft YaHei", sans-serif; }
  .preview-tools { max-width: 900px; margin: 24px auto 0; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 0 24px; }
  .preview-tools h1 { font-size: 16px; font-weight: 400; margin: 0 auto 0 0; }
  select { color: #dce0e8; background: #363940; border: 1px solid #555b66; padding: 6px 8px; font: inherit; }
  .stage { display: grid; place-items: center; min-height: 600px; padding: 42px 20px; }
  .machine { width: 768px; height: 484px; padding: 14px; background: #cbccd4; border: 8px solid transparent; border-image: url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYAAAADyCAYAAABEWhLBAAADuklEQVR4nO3YsW0CQRBA0TuLOgjtMhAFIBIqoCeHpgeLaiCkhGsAhC0kN2DO8n8v2GCTneyvZlyvdtcBgJzF/fg8HobT+fJ18fa6nHsmAH7ZdrP/DsBPjxAA8D89Pvovcw8CwDwEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKIEACBKAACiBAAgSgAAogQAIEoAAKLGaZqucw8BwHNtN/th8f5xfPKzAPwFVkAAUeN6tbMCAhh6brlyFUbPokkcAAAAAElFTkSuQmCC) 4 / 8px stretch; position: relative; }
  .title { height: 35px; color: #404040; padding: 0 10px; font-size: 18px; line-height: 27px; }
  .screen { height: calc(100% - 43px); padding: 22px 25px; border: 2px solid #f2f2f2; background: #9a9fb4; color: #404040; }
  .top { height: 90px; display: flex; align-items: flex-start; border-bottom: 2px solid #696d88; gap: 24px; }
  .level-group { display: flex; gap: 17px; align-items: center; width: 210px; }
  .level { color: #404040; font: 56px/1.05 Consolas, monospace; }
  .muted { color: #404040; font-size: 16px; }
  .status { color: #404040; font-size: 15px; margin-top: 8px; white-space: nowrap; }
  .status.off { color: #404040; }
  .concurrency { flex: 1; min-width: 0; }
  .concurrency-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; }
  .concurrency strong { font: 26px Consolas, monospace; font-weight: 400; color: #404040; }
  .bar { height: 12px; border: 2px solid #413f54; background: #adb0c4; margin: 10px 0 8px; }
  .fill { width: 43.75%; height: 100%; background: #878fa5; }
  .remaining { color: #404040; font-size: 14px; text-align: right; }
  .resources-title { font-size: 16px; color: #404040; margin: 16px 0 8px; }
  .resources { height: 210px; overflow: auto; scrollbar-width: thin; scrollbar-color: #adb0c4 #696d88; padding-right: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; min-height: 39px; gap: 14px; padding: 8px 0; border-bottom: 1px solid #696d88; font-size: 17px; }
  .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amount { white-space: nowrap; color: #404040; font: 18px Consolas,"Microsoft YaHei",sans-serif; }
  .empty { height: 100%; display: grid; place-items: center; color: #404040; }
  .preview-note { max-width: 900px; margin: 0 auto 25px; padding: 0 24px; color: #9aa0ab; line-height: 1.8; }
  .preview-note p { margin: 4px 0; }
  @media(max-width: 800px) { .stage { overflow-x: auto; place-items: start; } }
</style>
<div class="preview-tools">
  <h1>网络中心 · HTML 预览</h1>
  <select id="scenario" aria-label="演示状态">
    <option value="normal">正常供给</option><option value="empty">无资源供给</option>
    <option value="many">多种资源</option><option value="offline">网络未生效</option>
  </select>
  <select id="language" aria-label="预览语言"><option value="zh">中文</option><option value="en">English</option></select>
</div>
<div class="stage">
  <main class="machine" aria-label="游戏内网络中心显示界面">
    <div class="title" id="title">网络中心</div>
    <div class="screen">
      <div class="top">
        <div class="level-group">
          <div class="level" id="level">02</div>
          <div><div class="muted" id="level-label">网络等级</div><div class="status" id="status">网络已生效</div></div>
        </div>
        <div class="concurrency">
          <div class="concurrency-head"><span id="concurrency-label">并发占用</span><strong id="concurrency-value">28 / 64</strong></div>
          <div class="bar"><div class="fill" id="fill"></div></div>
          <div class="remaining" id="remaining">可用 36</div>
        </div>
      </div>
      <div class="resources-title" id="resources-title">资源供给</div>
      <div class="resources" id="resources"></div>
    </div>
  </main>
</div>
<div class="preview-note">
  <p>宽 384 游戏像素，高度随资源数量在 162～242 之间变化，超过最高高度才启用滑块滚动；此处放大 2 倍。上方选择框仅用于预览，不出现在游戏界面中。</p>
  <p>以下为使用方资源 Map 的演示数据，无需注册。资源按对象身份处理；零值和计算机本地资源不显示。资源行显示本地化名称、当前占用和产出。</p>
</div>
<script>
  const labels = {
    zh: {title:'网络中心',level:'网络等级',online:'网络已生效',offline:'网络未生效',concurrency:'并发占用',remaining:n=>`可用 ${n}`,resources:'资源供给',empty:'暂无资源供给'},
    en: {title:'Network Center',level:'Network level',online:'Network active',offline:'Network inactive',concurrency:'Concurrency',remaining:n=>`${n} available`,resources:'Resource supply',empty:'No resource supply'}
  };
  const resourceMap = [
    {id:'example:compute',name:{zh:'算力',en:'Computing power'},value:2400000,format:v=>(v/1000000).toFixed(2)+' MFLOP/s'},
    {id:'example:quantum',name:{zh:'量子计算',en:'Quantum computing'},value:128.5,format:v=>v.toFixed(1)+' Q/t'},
    {id:'example:bandwidth',name:{zh:'数据带宽',en:'Data bandwidth'},value:64000,format:v=>(v/1000).toFixed(2)+' kB/t'},
    {id:'example:simulation',name:{zh:'模拟能力',en:'Simulation capacity'},value:12.25,format:v=>v.toFixed(2)+' SU/t'},
    {id:'example:zero',name:{zh:'零值资源',en:'Zero resource'},value:0,format:v=>String(v)},
    {id:'example:cooling',name:{zh:'冷却',en:'Cooling'},value:1000,local:true,format:v=>v+' CU/t'}
  ];
  function render() {
    const language=document.getElementById('language').value;
    const scenario=document.getElementById('scenario').value;
    const text=labels[language];
    const active=scenario!=='offline';
    const used=active?28:0,total=active?64:0;
    document.getElementById('title').textContent=text.title;
    document.getElementById('level').textContent=active?'02':'—';
    document.getElementById('level-label').textContent=text.level;
    const status=document.getElementById('status'); status.textContent=active?text.online:text.offline;status.classList.toggle('off',!active);
    document.getElementById('concurrency-label').textContent=text.concurrency;
    document.getElementById('concurrency-value').textContent=`${used} / ${total}`;
    document.getElementById('remaining').textContent=text.remaining(total-used);
    document.getElementById('fill').style.width=total?`${used/total*100}%`:'0%';
    document.getElementById('resources-title').textContent=text.resources;
    const visible=active&&scenario!=='empty'?resourceMap.filter(r=>r.value!==0&&!r.local):[];
    if(scenario==='many')for(let i=0;i<6;i++)visible.push({id:'example:extra_'+i,name:{zh:'自定义资源 '+(i+1),en:'Custom resource '+(i+1)},value:4.375*(i+1),format:v=>v.toFixed(3)+' U/t'});
    const list=document.getElementById('resources');list.replaceChildren();
    const rows=Math.max(1,Math.min(5,visible.length));
    document.querySelector('.machine').style.height=((142+rows*20)*2)+'px';
    list.style.height=(rows*40)+'px';
    list.style.overflowY=visible.length>5?'auto':'hidden';
    if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=text.empty;list.append(empty);}
    for(const resource of visible){const row=document.createElement('div');row.className='row';row.textContent=resource.name[language]+'：'+resource.format(resource.value*0.3125)+' / '+resource.format(resource.value);row.title=row.textContent;list.append(row);}
  }
  document.getElementById('scenario').addEventListener('change',render);
  document.getElementById('language').addEventListener('change',render);
  render();
</script>
</html>
