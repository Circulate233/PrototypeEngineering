    #pe-data-center .dc-entry-level { font-size:12px; text-align:right; }

    #pe-data-center .dc-remove-buttons { display:grid; grid-template-columns:1fr 1fr; gap:4px; }

    #pe-data-center .dc-name span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    #pe-data-center .dc-pair { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:20px; }
    #pe-data-center .dc-separator { height:1px; background:var(--dc-line); flex:none; margin:3px 0; }

    #pe-data-center .dc-action { height:24px; padding:0 6px; }

    #pe-data-center .dc-action:disabled { opacity:0.5; cursor:default; }
    #pe-data-center .dc-heading-actions { display:flex; gap:4px; align-items:center; }
    #pe-data-center .dc-icon-button { width:30px; height:30px; border:0; padding:3px; background:var(--dc-square) center / 100% 100%; image-rendering:pixelated; }

    #pe-data-center .dc-icon-button img { width:100%; height:100%; image-rendering:pixelated; }
    #pe-data-center .dc-transfer { display:flex; align-items:center; justify-content:center; gap:10px; padding:4px 0 0; }

    #pe-data-center .dc-arrow::after { content:""; position:absolute; right:0; top:0; border-left:13px solid var(--dc-arrow); border-top:8px solid transparent; border-bottom:8px solid transparent; }
    #pe-data-center .dc-arrow.dc-ready::before { background:var(--dc-dark); }
    #pe-data-center .dc-arrow.dc-ready::after { border-left-color:var(--dc-dark); }
    #pe-data-center .dc-reason { min-height:20px; font-size:12px; line-height:20px; text-align:center; }
    #pe-data-center .dc-slot { position:relative; width:30px; height:30px; padding:3px; border:0; color:inherit; background:var(--dc-slot); box-shadow:inset 0 2px var(--dc-panel), inset 2px 0 var(--dc-panel), inset 0 -2px var(--dc-light), inset -2px 0 var(--dc-light); }
    #pe-data-center .dc-slot:hover::after { content:""; position:absolute; inset:3px; background:#ffffff80; pointer-events:none; }
    #pe-data-center .dc-slot img { width:100%; height:100%; image-rendering:pixelated; display:block; pointer-events:none; }
    #pe-data-center .dc-slot-large { width:40px; height:40px; padding:8px; }

    #pe-data-center .dc-ghost img { opacity:0.45; }
    #pe-data-center .dc-count { position:absolute; right:1px; bottom:0; font-size:11px; line-height:12px; color:var(--dc-light); text-shadow:1px 1px var(--dc-dark),-1px 0 var(--dc-dark),0 -1px var(--dc-dark); font-variant-numeric:tabular-nums; pointer-events:none; }

    #pe-data-center .dc-held { position:fixed; z-index:11; width:24px; height:24px; pointer-events:none; }

      </div>

      }

      function click(slot,button,shift) {
        const item = slots[slot];
        if (slot === "output") {
          if (!item) {
            if (button === 0 && outputPreview()) performDownload();
            return;
          }
          if (shift) {
            if (insert(item,toPlayer())) slots.output = null;
          } else if (!cursor) {
            cursor = item;
            slots.output = null;
          }
          message = null;
          return;
        }
        if (shift) {
          if (!item) return;
          const order = slot === "input" ? toPlayer()
            : !slots.input || same(slots.input,item) ? ["input"]
            : Number(slot.slice(3)) < 9 ? range(9,36) : range(0,9);
          if (insert(item,order)) slots[slot] = null;
          message = null;
          return;
        }
        if (button === 0) {
          if (!cursor) {
            cursor = item;
            slots[slot] = null;
          } else if (!accepts(slot,cursor)) return;
          else if (!item) {
            slots[slot] = cursor;
            cursor = null;
          } else if (same(item,cursor)) {
            const moved = Math.min(cursor.count,item.max - item.count);
            item.count += moved;
            cursor.count -= moved;
            if (!cursor.count) cursor = null;
          } else {
            slots[slot] = cursor;
            cursor = item;
          }
        } else if (button === 2) {
          if (!cursor && item) {
            const taken = Math.ceil(item.count / 2);
            cursor = Object.assign({},item,{count:taken});
            item.count -= taken;
            if (!item.count) slots[slot] = null;
          } else if (cursor && accepts(slot,cursor) && (!item || same(item,cursor) && item.count < item.max)) {
            if (item) item.count++;
            else slots[slot] = Object.assign({},cursor,{count:1});
            cursor.count--;
            if (!cursor.count) cursor = null;
          }
        }
        message = null;
      }

      root.addEventListener("contextmenu", event => {
        if (event.target.closest("[data-slot]")) event.preventDefault();
      });
      root.addEventListener("mousedown", event => {
        const slot = event.target.closest("[data-slot]");
        if (!slot) return;
        event.preventDefault();
        click(slot.dataset.slot,event.button,event.shiftKey);
        render();
      });
      root.addEventListener("click", event => {
        const keyboardSlot = event.target.closest("[data-slot]");
        if (keyboardSlot && event.detail === 0) {
          click(keyboardSlot.dataset.slot,0,event.shiftKey);
          render();
          return;
        }
        const storedEntry = event.target.closest("[data-stored]");
        if (storedEntry) {
          if (selectedStored !== storedEntry.dataset.stored) removing = false;
          selectedStored = storedEntry.dataset.stored;
          render();
          return;
        }
        const chosen = event.target.closest("[data-choose]");
        if (chosen && !chosen.disabled) {
          download = chosen.dataset.choose;
          message = null;
          byId("dc-overview").hidden = true;
          render();
          return;
        }
        const button = event.target.closest("button");
        if (!button || button.disabled) return;
        switch (button.id) {
          case "dc-mode-toggle": mode = mode === "export" ? "import" : "export"; message = null; break;
          case "dc-choose": byId("dc-overview").hidden = false; break;
          case "dc-overview-close": byId("dc-overview").hidden = true; break;
          case "dc-remove-start": removing = true; break;
          case "dc-remove-no": removing = false; break;
          case "dc-remove-yes":
            delete stored[selectedStored];
            removing = false;
            message = null;
            break;
          default: return;
        }
        render();
      });
      root.addEventListener("change", event => {
        if (event.target.name !== "dc-state") return;
        state = event.target.value;
        stored = state === "empty" ? {} : Object.assign({},initialStored);
        removing = false;
        message = null;
        byId("dc-overview").hidden = true;
        render();
      });
      function moveCursor(event) {
        mouse = {x:event.clientX,y:event.clientY};
        const held = byId("dc-held");
        held.style.left = mouse.x - 12 + "px";
        held.style.top = mouse.y - 12 + "px";
      }
      root.addEventListener("mousemove", moveCursor);
      byId("dc-back-icon").src = assets.back;
      render();
    })();
  </script>
</div>
