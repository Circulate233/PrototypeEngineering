    #pe-data-center .dc-inset { background:var(--dc-panel); border:2px solid var(--dc-light); }
    #pe-data-center .dc-pane { padding:8px; min-width:0; min-height:0; display:flex; flex-direction:column; gap:4px; }
    #pe-data-center .dc-heading { display:flex; justify-content:space-between; align-items:center; gap:6px; min-height:20px; }
    #pe-data-center .dc-list { list-style:none; margin:0; padding:0 4px 0 0; flex:1; min-height:0; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#878fa5 var(--dc-panel); }
    #pe-data-center .dc-list li + li { border-top:1px solid var(--dc-line); }
    #pe-data-center .dc-entry { display:grid; grid-template-columns:24px minmax(0,1fr) auto; align-items:center; gap:6px; width:100%; height:32px; border:0; padding:3px 5px; background:transparent; color:inherit; font:inherit; text-align:left; }

    #pe-data-center .dc-entry:hover { background:var(--dc-hover); }
    #pe-data-center .dc-entry img, #pe-data-center .dc-name img { width:24px; height:24px; image-rendering:pixelated; }
    #pe-data-center .dc-entry-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #pe-data-center .dc-entry-level { font-size:12px; text-align:right; }
    #pe-data-center .dc-empty { display:flex; align-items:center; justify-content:center; flex:1; min-height:60px; font-size:13px; text-align:center; }
    #pe-data-center .dc-detail { display:flex; flex-direction:column; gap:2px; flex:1; min-height:0; }
    #pe-data-center .dc-name { display:grid; grid-template-columns:24px minmax(0,1fr); align-items:center; gap:8px; min-height:28px; }
    #pe-data-center .dc-name span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #pe-data-center .dc-pair { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:20px; }
    #pe-data-center .dc-separator { height:1px; background:var(--dc-line); flex:none; margin:3px 0; }
    #pe-data-center .dc-stepper { display:flex; align-items:center; gap:6px; }
    #pe-data-center .dc-stepper .dc-number { width:22px; text-align:center; }
    #pe-data-center .dc-step { display:flex; align-items:center; justify-content:center; width:24px; height:22px; padding:0; font:12px/12px "Microsoft YaHei","Segoe UI",sans-serif; color:var(--dc-light); background:transparent; border:4px solid transparent; border-image:var(--dc-button) 2 / 4px stretch; image-rendering:pixelated; }
    #pe-data-center .dc-step:hover:not(:disabled) { color:#517497; border-image-source:var(--dc-button-hover); }
    #pe-data-center .dc-step:disabled { opacity:0.5; cursor:default; }
    #pe-data-center .dc-transfer { display:flex; align-items:center; justify-content:center; gap:10px; padding:6px 0 2px; }

    #pe-data-center .dc-arrow::after { content:""; position:absolute; right:0; top:0; border-left:13px solid var(--dc-arrow); border-top:8px solid transparent; border-bottom:8px solid transparent; }

        {id:"analysis",name:"高精度数据分析与长期归档",icon:"calculation",stored:1,max:3,tiers:[2,3,3],cost:1}
      ];
      const memberLevels = {parallel:[3,2],compression:[2,2],automation:[1,1],sampling:[0,0],connection:[4,3],signal:[2,1],analysis:[1,1]};
      const blank = tier => ({key:"blank" + tier,name:"空白研究盘（" + tier + " 阶）",icon:"blank" + tier,count:1,max:64,material:true,tier});
      const stack = (base,count) => Object.assign({},base,{count});
      const slots = {input:null,output:null};
      for (let index = 0; index < 36; index++) slots["inv" + index] = null;
      slots.inv0 = stack(blank(1),3);
      slots.inv4 = stack(blank(3),1);
      slots.inv9 = {key:"silicon",name:"硅",icon:"silicon",count:24,max:64};
      slots.inv14 = {key:"certus",name:"赛特斯石英水晶",icon:"certus",count:7,max:64};
      slots.inv27 = stack(blank(2),12);
      slots.inv30 = {key:"matter",name:"物质球",icon:"matter",count:16,max:64};
      const summary = {level:2,capacity:16};
      let state = "active";
      let selected = research[0].id;
      let target = 1;
      let cursor = null;
      let message = null;
      let mouse = {x:0,y:0};
      const byId = id => root.querySelector("#" + id);
      const current = () => research.find(entry => entry.id === selected);
      const listed = () => state === "denied" || state === "empty" ? [] : research;
      const same = (a,b) => a && b && a.key === b.key;
      const accepts = (slot,item) => slot !== "output" && (slot !== "input" || item.material === true);

      function stateReason() {
        return {inactive:"只有队伍当前活动数据库可以下载",pending:"世界存档待确认，暂不能下载",readonly:"没有下载权限"}[state];
      }
      function downloadOutput() {
        const entry = listed().length ? current() : null;
        const input = slots.input;
        if (stateReason() || !entry || !input || slots.output) return null;
        if (entry.tiers[target - 1] > input.tier) return null;
        return {key:"disk" + input.tier + ":" + entry.id + ":" + target,name:"研究盘 · " + entry.name + " Lv." + target,
          icon:"disk" + input.tier,count:1,max:1,detail:entry.name + " Lv." + target + "\n盘阶级 " + input.tier};
      }
      function reason() {
        const entry = listed().length ? current() : null;
        if (stateReason()) return {text:stateReason(),good:false};
        if (message) return message;
        if (!entry) return {text:"",good:false};
        if (slots.output) return {text:"取出输出物品后才能继续下载",good:false};
        if (!slots.input) return {text:"放入下载材料",good:false};
        const tier = entry.tiers[target - 1];
        if (tier > slots.input.tier) return {text:"研究阶级 " + tier + " 高于材料阶级 " + slots.input.tier,good:false};
        return {text:"点击输出槽下载",good:true};
      }

      function drawSlot(element,item,ghost) {
        element.replaceChildren();
        element.classList.toggle("dc-ghost",!!ghost);
        const shown = item || ghost;
        if (!shown) {
          element.dataset.tip = "";
          return;
        }
        const image = document.createElement("img");
        image.alt = "";
        image.src = assets[shown.icon];
        element.append(image);
        if (shown.count > 1) {
          const count = document.createElement("span");
          count.className = "dc-count";
          count.textContent = shown.count;
          element.append(count);
        }
        const entry = current();
        element.dataset.tip = ghost ? ghost.name + "\n点击下载：消耗 1 个" + slots.input.name +
          (entry.cost ? "，每名成员扣除 " + entry.cost + " 级" : "")
          : item.name + (item.count > 1 ? " × " + item.count : "") + (item.detail ? "\n" + item.detail : "");
      }

      function render() {
        const denied = state === "denied";
        byId("dc-tier").textContent = denied ? "" : "等级 " + summary.level;
        byId("dc-capacity").textContent = denied ? "" : "容量 " + listed().length + " / " + summary.capacity;
        const status = {active:["活动",true],inactive:["未启用",false],pending:["存档待确认",false],readonly:["活动",true],denied:["",false],empty:["活动",true]}[state];
        byId("dc-state").textContent = status[0];
        byId("dc-state").className = status[1] ? "dc-good" : "";
        const list = byId("dc-list");
        list.replaceChildren();
        for (const entry of listed()) {
          const item = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "dc-entry cursor-interaction";
          button.dataset.research = entry.id;
          button.setAttribute("aria-pressed", String(entry.id === selected));
          button.dataset.tip = entry.name + "\n已存等级 " + entry.stored + " / 最高 " + entry.max;
          button.innerHTML = '<img alt="" src="' + assets[entry.icon] + '"><span class="dc-entry-name">' + entry.name +
            '</span><span class="dc-entry-level dc-number">Lv.' + entry.stored + "</span>";
          item.append(button);
          list.append(item);
        }
        if (!listed().length) {
          const empty = document.createElement("li");
          empty.className = "dc-empty";
          empty.textContent = denied ? "无查看权限" : "数据库中没有研究";
          list.append(empty);
        }
        const entry = listed().length ? current() : null;
        byId("dc-detail").hidden = !entry;
        byId("dc-detail-empty").hidden = !!entry;
        byId("dc-detail-empty").textContent = denied ? "" : "未选择研究";
        if (entry) {
          byId("dc-icon").src = assets[entry.icon];
          byId("dc-name").textContent = entry.name;
          byId("dc-name").dataset.tip = entry.name;
          byId("dc-stored").textContent = entry.stored + " / " + entry.max;
          byId("dc-target").textContent = target;
          byId("dc-research-tier").textContent = entry.tiers[target - 1];
          byId("dc-cost").textContent = entry.cost === 0 ? "无" : "每名成员 " + entry.cost + " 级";
          byId("dc-less").disabled = target <= 1;
          byId("dc-more").disabled = target >= entry.stored;
          const ghost = downloadOutput();
          drawSlot(root.querySelector('[data-slot="input"]'),slots.input,null);
          drawSlot(root.querySelector('[data-slot="output"]'),slots.output,slots.output ? null : ghost);
          byId("dc-arrow").classList.toggle("dc-ready",!!ghost);
          const text = reason();
          byId("dc-reason").textContent = text.text;
          byId("dc-reason").className = "dc-reason " + (text.good ? "dc-good" : text.text ? "dc-bad" : "");
        }
        for (const [id,from] of [["dc-main",9],["dc-hotbar",0]]) {
          const grid = byId(id);
          if (!grid.children.length) for (let index = 0; index < (from ? 27 : 9); index++) {
            const slot = document.createElement("div");
            slot.className = "dc-slot cursor-interaction";
            slot.dataset.slot = "inv" + (from ? index + 9 : index);
            grid.append(slot);
          }
          for (const slot of grid.children) drawSlot(slot,slots[slot.dataset.slot],null);
        }
        const held = byId("dc-held");
        held.hidden = !cursor;
        held.replaceChildren();
        if (cursor) {
          held.innerHTML = '<img alt="" src="' + assets[cursor.icon] + '">' + (cursor.count > 1 ? '<span class="dc-count">' + cursor.count + "</span>" : "");
          held.style.left = mouse.x - 12 + "px";
          held.style.top = mouse.y - 12 + "px";
        }
      }

      function insert(item,order) {
        for (const slot of order) {
          const target = slots[slot];
          if (!same(target,item) || target.count >= target.max) continue;
          const moved = Math.min(item.count,target.max - target.count);
          target.count += moved;
          item.count -= moved;
          if (!item.count) return true;
        }
        for (const slot of order) {
          if (slots[slot]) continue;
          slots[slot] = item;
          return true;
        }
        return false;
      }
      const range = (from,to) => Array.from({length:to - from},(value,index) => "inv" + (from + index));

      function download() {
        const entry = current();
        const output = downloadOutput();
        if (memberLevels[entry.id].some(level => level < entry.cost)) {
          message = {text:"成员研究等级不足，需每人 " + entry.cost + " 级",good:false};
          return;
        }
        memberLevels[entry.id] = memberLevels[entry.id].map(level => level - entry.cost);
        slots.input.count--;
        if (!slots.input.count) slots.input = null;
        slots.output = output;
        message = {text:"已下载 " + entry.name + " Lv." + target,good:true};
      }

      function click(slot,button,shift) {
        const item = slots[slot];
        if (slot === "output") {
          if (!item) {
            if (button === 0 && downloadOutput()) download();
            return;
          }
          if (shift) {
            if (insert(item,[...range(0,9).reverse(),...range(9,36).reverse()])) slots.output = null;
          } else if (!cursor) {
            cursor = item;
            slots.output = null;
          }
          message = null;
          return;
        }
        if (shift) {
          if (!item) return;
          const order = slot === "input" ? [...range(0,9).reverse(),...range(9,36).reverse()]
            : item.material && !slots.input || same(slots.input,item) ? ["input"]
            : Number(slot.slice(3)) < 9 ? range(9,36) : range(0,9);
          if (insert(item,order)) slots[slot] = null;
          message = null;
          return;
        }
        if (button === 0) {
          if (!cursor) {
            cursor = item;
            slots[slot] = null;
          } else if (!accepts(slot,cursor)) return;
          else if (!item) {
            slots[slot] = cursor;
            cursor = null;
          } else if (same(item,cursor)) {
            const moved = Math.min(cursor.count,item.max - item.count);
            item.count += moved;
            cursor.count -= moved;
            if (!cursor.count) cursor = null;
          } else {
            slots[slot] = cursor;
            cursor = item;
          }
        } else if (button === 2) {
          if (!cursor && item) {
            const taken = Math.ceil(item.count / 2);
            cursor = Object.assign({},item,{count:taken});
            item.count -= taken;
            if (!item.count) slots[slot] = null;
          } else if (cursor && accepts(slot,cursor) && (!item || same(item,cursor) && item.count < item.max)) {
            if (item) item.count++;
            else slots[slot] = Object.assign({},cursor,{count:1});
            cursor.count--;
            if (!cursor.count) cursor = null;
          }
        }
        message = null;
      }

      root.addEventListener("contextmenu", event => {
        if (event.target.closest("[data-slot]")) event.preventDefault();
      });
      root.addEventListener("mousedown", event => {
        const slot = event.target.closest("[data-slot]");
        if (!slot) return;
        event.preventDefault();
        click(slot.dataset.slot,event.button,event.shiftKey);
        render();
        moveTooltip(event);
      });
      root.addEventListener("click", event => {
        const entry = event.target.closest("[data-research]");
        if (entry) {
          if (selected !== entry.dataset.research) {
            selected = entry.dataset.research;
            target = 1;
            message = null;
          }
          render();
          return;
        }
        const button = event.target.closest("button");
        if (!button || button.disabled) return;
        if (button.id === "dc-less") target--;
        else if (button.id === "dc-more") target++;
        else return;
        message = null;
        render();
      });
      root.addEventListener("change", event => {
        if (event.target.name !== "dc-state") return;
        state = event.target.value;
        message = null;
        target = 1;
        render();
      });
      const tooltip = byId("dc-tooltip");
      function moveTooltip(event) {
        mouse = {x:event.clientX,y:event.clientY};
        const held = byId("dc-held");
        held.style.left = mouse.x - 12 + "px";
        held.style.top = mouse.y - 12 + "px";
        const owner = cursor ? null : event.target.closest("[data-tip]");
        tooltip.hidden = !owner || !owner.dataset.tip;
        if (tooltip.hidden) return;
        tooltip.textContent = owner.dataset.tip;
        tooltip.style.left = mouse.x + 12 + "px";
        tooltip.style.top = mouse.y - 18 + "px";
      }
      root.addEventListener("mousemove", moveTooltip);
      root.addEventListener("mouseleave", () => tooltip.hidden = true);
      render();
    })();
  </script>
</div>
